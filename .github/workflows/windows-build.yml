name: CPRD Knowledge Desk Windows CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/knowledge-desk-v1
  pull_request:

permissions:
  contents: read

concurrency:
  group: cprd-knowledge-desk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify toolchain
        shell: pwsh
        run: ./eng/windows/verify-toolchain.ps1

      - name: Restore, test, and build
        shell: pwsh
        run: ./eng/windows/build.ps1 -Configuration Release
